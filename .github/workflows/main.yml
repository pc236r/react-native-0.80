name: RNDemo80 - Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      # ==================================================================
      # 1. Node.js 环境配置 (根据 README.md: Node.js >= 18)
      # ==================================================================
      - name: ⚙️ Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # 根据标准 RN 项目结构，锁定缓存文件
          cache: 'npm'

      # ==================================================================
      # 2. 安装依赖 (根据 README.md: npm install)
      # ==================================================================
      - name: 📦 Install Dependencies
        run: |
          # 强制使用 --legacy-peer-deps 解决 RN 常见的依赖冲突
          npm install --legacy-peer-deps
          
          # iOS 需要 CocoaPods (虽然我们只构建 Android，但为了完整性或未来扩展)
          # 如果项目根目录没有 ios/podfile，这一步会跳过或报错，可删除
          # cd ios && pod install --repo-update && cd ..

      # ==================================================================
      # 3. Android 构建环境 (根据 README.md: JDK 17)
      # ==================================================================
      - name: ⚙️ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==================================================================
      # 4. 执行构建
      # ==================================================================
      - name: 🛠️ Build Android APK
        run: |
          cd android
          # 赋予执行权限 (防止 Permission Denied)
          chmod +x gradlew
          # 执行构建
          ./gradlew assembleDebug --no-daemon

      # ==================================================================
      # 5. 输出结果
      # ==================================================================
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

